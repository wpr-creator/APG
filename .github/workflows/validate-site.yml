name: Validate site

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate site
        run: node scripts/validate-site.js

      - name: Check search index coverage and freshness
        run: node scripts/build-search-index.js --check

      - name: Test search aliases and spelling
        run: node scripts/test-site-search.js

      - name: Test canonical course entry
        run: node scripts/test-course-entry.js

      - name: Test glossary presentation
        run: node scripts/test-glossary-presentation.js

      - name: Test election tracker
        run: node scripts/test-election-tracker.js

      - name: Test library collections
        run: node scripts/test-library-collections.js

      - name: Check reader content coverage
        run: node scripts/test-reader-coverage.js

      - name: Test course navigation
        run: node scripts/test-course-navigation.js

      - name: Test header ticket availability
        run: node scripts/test-header-ticket-state.js

      - name: Test Article V activity
        run: node scripts/test-article-v.js

      - name: Test History Lesson teaching structure
        run: node scripts/test-history-reader.js

      - name: Test reading progress indicator
        run: node scripts/test-reading-progress.js
