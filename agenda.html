<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agenda — AP Government</title>
  <link rel="stylesheet" href="styles-base.css"><link rel="stylesheet" href="styles-gov-theme.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a><div class="stars-stripe"></div>
  <header><div class="header-inner"><a class="header-brand" href="/APG/"><span class="header-seal" aria-hidden="true">AP</span><span class="header-text"><h1>Mr. Rogers — AP Government &amp; Politics</h1><p>O'Farrell High School · Daily Agenda</p></span></a></div></header>
  <nav aria-label="Course navigation"><div id="app-nav"></div></nav>
  <main class="agenda-shell" id="main-content">
    <section class="agenda-layout">
      <article class="agenda-board">
        <h1 id="agenda-title">Agenda</h1>
        <div class="agenda-copy" id="agenda-copy">COMING SOON.</div>
      </article>
      <aside class="agenda-date-panel">
        <div class="agenda-today"><p id="agenda-weekday"></p><time id="agenda-date"></time></div>
        <button class="agenda-edit-button" type="button" id="agenda-edit">Edit agenda</button>
      </aside>
    </section>
    <dialog id="agenda-dialog">
      <form method="dialog" id="agenda-form">
        <div class="dialog-heading"><h2>Edit Agenda</h2><button value="cancel" aria-label="Close">×</button></div>
        <label>Heading<input id="agenda-title-input" maxlength="40"></label>
        <label>Agenda<textarea id="agenda-copy-input" rows="12"></textarea></label>
        <p>Changes are saved in this browser. Use Copy agenda to move the text between devices.</p>
        <div class="dialog-actions"><button type="button" id="agenda-copy-button">Copy agenda</button><button value="save">Save</button></div>
      </form>
    </dialog>
  </main>
  <script src="data-required.js"></script><script src="nav-render.js"></script><script src="agenda.js"></script>
  <script>renderNav({currentFile:"agenda.html"});</script>
</body>
</html>
