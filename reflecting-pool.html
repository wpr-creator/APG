<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Reflecting Pool · AP Government</title><meta name="description" content="Practice AP Government beside the Reflecting Pool. Choose your units and review terms, cases, documents, and scenarios at your own pace."><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="course-fonts.css"><link rel="stylesheet" href="reflecting-pool.css"><script type="module" src="reflecting-pool.js"></script></head><body><canvas id="world" aria-hidden="true"></canvas><div class="vignette" aria-hidden="true"></div><header class="pool-header"><a href="index.html">← AP GOVERNMENT</a><div class="pool-controls"><button id="journal-toggle" aria-expanded="true">Close journal</button><button id="motion" aria-pressed="false">Pause scenery</button><button id="sound" aria-pressed="false">Sound off</button><label class="volume">Volume <input id="volume" type="range" min="0" max="100" value="25"></label></div></header><main><div class="scene-title"><p>WASHINGTON, D.C.</p><h1>The Reflecting Pool</h1></div><section class="journal" aria-label="Review journal"><div class="binding" aria-hidden="true"></div><div id="setup"><p class="eyebrow">YOUR JOURNAL</p><h2>What will you practice?</h2><form id="settings"><fieldset><legend>Units</legend><div class="units"><label><input type="checkbox" name="unit" value="1" checked><span>01</span>Foundations</label><label><input type="checkbox" name="unit" value="2" checked><span>02</span>Branches</label><label><input type="checkbox" name="unit" value="3"><span>03</span>Rights</label><label><input type="checkbox" name="unit" value="4"><span>04</span>Beliefs</label><label><input type="checkbox" name="unit" value="5"><span>05</span>Participation</label></div></fieldset><fieldset><legend>Include</legend><div class="categories"><label><input type="checkbox" name="category" value="Terms" checked>Terms</label><label><input type="checkbox" name="category" value="Clauses" checked>Clauses</label><label><input type="checkbox" name="category" value="Principles" checked>Principles</label><label><input type="checkbox" name="category" value="Cases" checked>Cases</label><label><input type="checkbox" name="category" value="Documents" checked>Documents</label><label><input type="checkbox" name="category" value="Scenarios" checked>Scenarios · Units 1–2</label></div></fieldset><p id="availability" role="status"></p><button class="primary" type="submit">Open journal <span>→</span></button></form><p id="saved" class="small"></p></div><div id="practice" hidden><div class="journal-top"><p class="eyebrow" id="topic"></p><button class="text-button" id="change">Change practice</button></div><h2 id="question" tabindex="-1"></h2><div id="choices" class="choices"></div><div id="feedback" aria-live="polite" hidden><strong id="result"></strong><p id="explanation"></p><a id="reading" hidden>Read the page →</a></div><button class="primary" id="next" hidden>Turn the page <span>→</span></button><div class="journal-bottom"><span id="progress"></span><button class="text-button" id="review">Revisit notes</button></div><section id="notes" hidden aria-label="Your review notes"><h3>Your notes</h3><div id="note-list"></div><button class="text-button" id="close-notes">Close notes</button></section></div><p id="error" role="alert" hidden></p></section></main><noscript><p class="no-js">Turn on JavaScript to open the review journal.</p></noscript></body></html>
